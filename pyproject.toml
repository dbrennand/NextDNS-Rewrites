[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ndrw"
version = "2.0.0"
description = "Manage NextDNS rewrites from a YAML configuration."
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "nextdns>=4.1.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
ndrw = "ndrw.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.14.2",
]
test = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=ndrw --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=80"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
